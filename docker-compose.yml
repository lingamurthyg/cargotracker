version: '3.8'

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      # Java Options
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      
      # Application Configuration
      - GRAPH_TRAVERSAL_URL=http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path
      
      # Database Configuration (H2 embedded by default)
      - DB_DRIVER_CLASS=org.h2.jdbcx.JdbcDataSource
      - DB_JDBC_URL=jdbc:h2:file:/app/data/cargo-tracker-database
      - DB_USER=
      - DB_PASSWORD=
      
      # External Database Configuration (uncomment and configure if using external DB)
      # - DB_DRIVER_CLASS=org.postgresql.ds.PGPoolingDataSource
      # - DB_JDBC_URL=jdbc:postgresql://your-db-host:5432/cargotracker
      # - DB_USER=your-db-user
      # - DB_PASSWORD=your-db-password
      
      # JMS Configuration (embedded by default in Payara)
      # External JMS broker can be configured via environment variables if needed
      
      # Timezone
      - TZ=UTC
    volumes:
      # Persist H2 database data
      - cargo-tracker-data:/app/data
      
      # Optional: Mount external configuration
      # - ./config:/opt/payara/config:ro
    networks:
      - cargo-tracker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/cargo-tracker/rest/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  cargo-tracker-data:
    driver: local

networks:
  cargo-tracker-network:
    driver: bridge
