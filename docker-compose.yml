version: '3.8'

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      # Java/JVM Configuration
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
      
      # Database Configuration (H2 embedded by default)
      # For external database, uncomment and configure:
      # - DB_DRIVER_CLASS=org.postgresql.ds.PGPoolingDataSource
      # - DB_JDBC_URL=jdbc:postgresql://host.docker.internal:5432/cargotracker
      # - DB_USER=postgres
      # - DB_PASSWORD=postgres
      
      # Application Configuration
      - GRAPH_TRAVERSAL_URL=http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path
    volumes:
      # Persist H2 database data
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    networks:
      - cargo-tracker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/cargo-tracker/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  cargo-tracker-network:
    driver: bridge

volumes:
  cargo-tracker-data:
    driver: local
