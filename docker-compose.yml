version: '3.8'

services:
  cargo-tracker:
    image: cargo-tracker:latest
    container_name: cargo-tracker-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
      - "7276:7276"
      - "9100:9100"
    environment:
      - HTTP_PORT=8080
      - HTTPS_PORT=8081
      - JMS_PORT=7276
      - JMS_SSL_PORT=9100
      - DB_URL=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
      - DB_USER=sa
      - DB_PASSWORD=
      - TIMER_DB_URL=jdbc:h2:mem:timerdb;DB_CLOSE_DELAY=-1
      - TIMER_DB_USER=sa
      - TIMER_DB_PASSWORD=
      - GRAPH_TRAVERSAL_URL=http://localhost:8080/graph-traversal/
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
      - TZ=UTC
    networks:
      - cargo-tracker-network
    restart: unless-stopped
    healthcheck:
      test: ["/opt/ol/wlp/bin/server", "status", "defaultServer"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

networks:
  cargo-tracker-network:
    driver: bridge