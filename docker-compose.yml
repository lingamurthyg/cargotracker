version: '3.8'

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker-app
    ports:
      - "8080:8080"
      - "8181:8181"
      - "4848:4848"
    environment:
      # Database Configuration (H2 embedded by default)
      - DB_DRIVER_CLASS=org.h2.jdbcx.JdbcDataSource
      - DB_JDBC_URL=jdbc:h2:file:/app/data/cargo-tracker-database
      - DB_USER=
      - DB_PASSWORD=
      # Graph Traversal Service URL
      - GRAPH_TRAVERSAL_URL=http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path
      # JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      # Timezone
      - TZ=UTC
    volumes:
      # Persist H2 database data
      - cargo-tracker-data:/app/data
    networks:
      - cargo-tracker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/cargo-tracker/rest/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  cargo-tracker-data:
    driver: local

networks:
  cargo-tracker-network:
    driver: bridge
