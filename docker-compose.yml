version: '3.8'

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker-app
    ports:
      - "8080:8080"
    environment:
      # JVM Options
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      # Database Configuration (using H2 embedded)
      DB_DRIVER_CLASS: "org.h2.jdbcx.JdbcDataSource"
      DB_JDBC_URL: "jdbc:h2:file:/opt/app/data/cargo-tracker-database"
      DB_USER: ""
      DB_PASSWORD: ""
      # Application Configuration
      GRAPH_TRAVERSAL_URL: "http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path"
      # Timezone
      TZ: "UTC"
    volumes:
      - ./data:/opt/app/data
      - ./logs:/opt/app/logs
    networks:
      - cargo-tracker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/cargo-tracker/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  cargo-tracker-network:
    driver: bridge

volumes:
  data:
  logs:
