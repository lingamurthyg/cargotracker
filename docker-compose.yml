version: '3.8'

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
    volumes:
      - ./cargo-tracker-data:/opt/payara/cargo-tracker-data
      - ./logs:/opt/payara/logs
    networks:
      - cargo-tracker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "java", "-cp", "/opt/payara/payara-micro.jar", "fish.payara.micro.PayaraMicro", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  cargo-tracker-network:
    driver: bridge

volumes:
  cargo-tracker-data:
  logs:
