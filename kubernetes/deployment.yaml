apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: v1
    spec:
      containers:
      - name: cargo-tracker
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: admin
          containerPort: 4848
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: DB_JDBC_URL
          value: "{{DB_JDBC_URL}}"
        - name: GRAPH_TRAVERSAL_URL
          value: "http://cargo-tracker-service.cargo-tracker.svc.cluster.local/cargo-tracker/rest/graph-traversal/shortest-path"
        - name: TZ
          value: "UTC"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /cargo-tracker/
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /cargo-tracker/
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: cargo-data
          mountPath: /opt/payara/cargo-tracker-data
        - name: cargo-logs
          mountPath: /opt/payara/glassfish/domains/domain1/logs
      volumes:
      - name: cargo-data
        emptyDir: {}
      - name: cargo-logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30