apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: v1
    spec:
      containers:
      - name: cargo-tracker
        image: {{IMAGE_URI}}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: TZ
          value: "UTC"
        # Database Configuration (optional - uncomment and configure for external database)
        # - name: DB_DRIVER_CLASS
        #   value: "{{DB_DRIVER_CLASS}}"
        # - name: DB_JDBC_URL
        #   value: "{{DB_JDBC_URL}}"
        # - name: DB_USER
        #   value: "{{DB_USER}}"
        # - name: DB_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: cargo-tracker-db-secret
        #       key: password
        # Application Configuration
        - name: GRAPH_TRAVERSAL_URL
          value: "http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /cargo-tracker/
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /cargo-tracker/
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: cargo-tracker-data
          mountPath: /opt/payara/cargo-tracker-data
      volumes:
      - name: cargo-tracker-data
        emptyDir: {}
      restartPolicy: Always
