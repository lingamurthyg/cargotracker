apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-tracker
  namespace: cargo-tracker
  labels:
    app: cargo-tracker
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-tracker
  template:
    metadata:
      labels:
        app: cargo-tracker
        version: v1
    spec:
      containers:
      - name: cargo-tracker
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8081
          protocol: TCP
        - name: jms
          containerPort: 7276
          protocol: TCP
        - name: jms-ssl
          containerPort: 9100
          protocol: TCP
        env:
        - name: HTTP_PORT
          value: "8080"
        - name: HTTPS_PORT
          value: "8081"
        - name: JMS_PORT
          value: "7276"
        - name: JMS_SSL_PORT
          value: "9100"
        - name: DB_URL
          value: "{{DB_URL}}"
        - name: DB_USER
          value: "{{DB_USER}}"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cargo-tracker-secrets
              key: db-password
              optional: true
        - name: TIMER_DB_URL
          value: "{{TIMER_DB_URL}}"
        - name: TIMER_DB_USER
          value: "{{TIMER_DB_USER}}"
        - name: TIMER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cargo-tracker-secrets
              key: timer-db-password
              optional: true
        - name: GRAPH_TRAVERSAL_URL
          value: "{{GRAPH_TRAVERSAL_URL}}"
        - name: ADMIN_USER
          value: "{{ADMIN_USER}}"
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cargo-tracker-secrets
              key: admin-password
              optional: true
        - name: TZ
          value: "UTC"
        - name: LANG
          value: "en_US.UTF-8"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          exec:
            command:
            - /opt/ol/wlp/bin/server
            - status
            - defaultServer
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /cargo-tracker/
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /cargo-tracker/
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 12
      restartPolicy: Always
      terminationGracePeriodSeconds: 30